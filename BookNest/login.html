<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Login</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1><a href="index.html">BookNest</a></h1>

    </header>
    <main>
        <section id="login">
            <h2>Bem Vindo de Volta!</h2>
            <p>Entre na sua conta para acessar a biblioteca.</p>

            <form>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha"required>

                <button type="submit">Entrar</button>
            </form>
            <p>
                Ainda não tem conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>
    </main>
    <footer>
        <p>BookNest - Sua biblioteca pessoal digital.</p>
        <p>&copy;2026 BookNest. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
