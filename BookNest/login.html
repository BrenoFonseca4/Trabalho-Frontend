
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-login">

    <header>
        <h1><a href="index.html">BookNest</a></h1>
    </header>

    <main>

        <section id="login">

            <h2>Bem-vindo de volta!</h2>

            <p>Entre na sua conta para acessar sua biblioteca.</p>

            <form action="home.html">

                <fieldset>

                    <legend>Informações de acesso</legend>

                    <div class="campo-formulario">

                        <label for="email">E-mail:</label>

                        <input type="email" id="email" name="email"
                            placeholder="Digite seu e-mail" required>

                    </div>

                    <div class="campo-formulario">

                        <label for="senha">Senha:</label>

                        <input type="password" id="senha" name="senha"
                            placeholder="Digite sua senha" required>

                    </div>

                </fieldset>

                <button type="submit">Entrar</button>

            </form>

            <p>
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

    <footer>
        <p>BookNest - Sua biblioteca pessoal digital.</p>
        <p>&copy; 2026 BookNest. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
