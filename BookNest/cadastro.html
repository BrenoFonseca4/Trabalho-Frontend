<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><a href="index.html">BookNest</a></h1>

    </header>
    <main>
        <section id="cadastro">
            <h2>Crie sua conta</h2>
            <p>Organize sua biblioteca pessoal!</p>

            <form>
                <label for="usuario">Nome de usuário:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Escolha um nome de usuario" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                <label for="Confirmar senha">Confirmar senha:</label>
                <input type="password" id="confirmar senha" name="confirmar senha" placeholder="Digite sua senha novamente" required>

                <button type="submit">Criar conta</button>
            </form>
            <p>
                Já possui uma conta?
                <a href="login.html">Entrar</a>


            </p>


        </section>
    </main>
    <footer>
        <p>BookNest - Sua biblioteca digital.</p>
        <p>&copy; 2026 BookNest. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
